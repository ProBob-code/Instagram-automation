<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG Growth Hub - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card glass-card">
            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">🔥</div>
                <h1 class="logo-text">IG Growth Hub</h1>
                <p class="logo-subtitle">Analyze & Optimize Your Profile</p>
            </div>

            <!-- Login Form -->
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label class="input-label" for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">@</span>
                        <input 
                            type="text" 
                            id="username" 
                            class="input-field" 
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            class="input-field" 
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="password-toggle" id="togglePassword">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-gradient" id="submitBtn">
                    <span class="btn-text">Analyze My Profile</span>
                </button>

                <!-- Error Message -->
                <div class="error-message" id="errorMessage" style="display: none; color: #FF5252; margin-top: 1rem; font-size: 0.9rem;"></div>
            </form>

            <!-- Trust Badges -->
            <div class="trust-badges">
                <div class="badge">
                    <span class="badge-icon">🔐</span>
                    <span>256-bit Encrypted</span>
                </div>
                <div class="badge">
                    <span class="badge-icon">💻</span>
                    <span>100% Local Processing</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
