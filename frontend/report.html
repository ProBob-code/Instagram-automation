<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boost Report - IG Growth Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .report-page {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .back-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: var(--bg-card);
        }

        .report-title {
            font-size: 1.5rem;
            margin: 0;
        }

        .report-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent-secondary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .actions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .actions-table th,
        .actions-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }

        .actions-table th {
            background: var(--bg-secondary);
            font-weight: 500;
            color: var(--text-secondary);
        }

        .actions-table tr:hover {
            background: var(--bg-input);
        }

        .action-link {
            color: var(--accent-secondary);
            text-decoration: none;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .action-success {
            color: var(--success);
        }

        .action-failed {
            color: var(--error);
        }

        .loading-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>

    <div class="report-page">
        <div class="report-header">
            <div>
                <h1 class="report-title">📊 Boost Report</h1>
                <p class="report-meta" id="reportMeta">Loading...</p>
            </div>
            <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
        </div>

        <div id="reportContent">
            <div class="loading-state">Loading report...</div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const filename = urlParams.get('file');

            if (!filename) {
                document.getElementById('reportContent').innerHTML =
                    '<div class="glass-card" style="padding: 2rem; text-align: center;">No report specified</div>';
                return;
            }

            try {
                const response = await fetch(`${IGGrowthHub.API_BASE}/reports/${encodeURIComponent(filename)}`);
                const report = await response.json();

                if (report.error) {
                    throw new Error(report.error);
                }

                renderReport(report);
            } catch (error) {
                document.getElementById('reportContent').innerHTML =
                    `<div class="glass-card" style="padding: 2rem; text-align: center;">Error: ${error.message}</div>`;
            }
        });

        function renderReport(report) {
            // Update meta
            const createdAt = new Date(report.created_at || report.completed_at);
            document.getElementById('reportMeta').textContent =
                `${report.username || 'Unknown'} • ${createdAt.toLocaleString()} • ${report.status}`;

            // Calculate duration
            let duration = '—';
            if (report.summary && report.summary.duration_seconds) {
                const mins = Math.floor(report.summary.duration_seconds / 60);
                duration = `${mins}m`;
            }

            const actions = report.actions || [];
            const successful = actions.filter(a => a.status === 'success').length;

            document.getElementById('reportContent').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${report.total_actions || actions.length}</div>
                        <div class="stat-label">Total Actions</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${successful}</div>
                        <div class="stat-label">Successful</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${duration}</div>
                        <div class="stat-label">Duration</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${(report.action_types || []).join(', ') || '—'}</div>
                        <div class="stat-label">Action Types</div>
                    </div>
                </div>

                <div class="glass-card" style="padding: 1.5rem;">
                    <h3 style="margin-bottom: 1rem;">📝 Actions Log</h3>
                    <p style="color: var(--text-muted); margin-bottom: 1rem;">Click on usernames or post links to verify on Instagram</p>
                    
                    ${actions.length > 0 ? `
                        <table class="actions-table">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Type</th>
                                    <th>Username</th>
                                    <th>Post</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${actions.map(action => {
                const time = new Date(action.timestamp).toLocaleTimeString();
                const username = action.target_username || 'unknown';
                const postUrl = action.target_url || '#';
                return `
                                        <tr>
                                            <td>${time}</td>
                                            <td>${action.action_type}</td>
                                            <td><a href="https://instagram.com/${username}" target="_blank" class="action-link">@${username}</a></td>
                                            <td><a href="${postUrl}" target="_blank" class="action-link">View Post</a></td>
                                            <td class="${action.status === 'success' ? 'action-success' : 'action-failed'}">${action.status}</td>
                                        </tr>
                                    `;
            }).join('')}
                            </tbody>
                        </table>
                    ` : '<p style="color: var(--text-muted);">No actions recorded</p>'}
                </div>
            `;
        }
    </script>
</body>

</html>
